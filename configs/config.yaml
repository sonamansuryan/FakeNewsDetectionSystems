paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_combined: "data/combined"
  models: "models"
  logs: "logs"
  reports: "reports"
  checkpoints: "models/checkpoints"

datasets:
  liar:
    name: "liar"
    huggingface_id: "liar"
    text_column: "statement"
    label_column: "label"
    description: "Political statements dataset"

  covid_19:
    name: "covid_19"
    huggingface_id: "Ar4ikov/twitter_covid_19_fake_news_dataset_extended"
    text_column: "text"
    label_column: "label"
    description: "COVID-19 misinformation"

  fakenewsnet:
    name: "fakenewsnet"
    huggingface_id: "GonzaloA/fake_news"
    text_column: "text"
    label_column: "label"
    description: "Fake news articles"

  fever_data:
    name: "fever_data"
    huggingface_id: "fever"
    subset: "v1.0"
    text_column: "claim"
    label_column: "label"
    description: "Fact verification dataset"

data_processing:
  max_length: 512
  test_size: 0.2
  validation_size: 0.1
  random_state: 42

  label_mapping:
    true: 0
    real: 0
    false: 1
    fake: 1
    supported: 0
    refuted: 1
    not enough info: 1
    mostly-true: 0
    half-true: 1
    barely-true: 1
    pants-fire: 1

  combination:
    strategy: "concatenate"
    balance_method: "oversample"
    min_samples_per_class: 1000

models:
  finbert:
    name: "ProsusAI/finbert"
    num_labels: 2
    max_length: 512
    output_dir: "models/finbert"
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1

  roberta:
    name: "roberta-base"
    num_labels: 2
    max_length: 512
    output_dir: "models/roberta"
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  num_epochs: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "linear"

  max_grad_norm: 1.0

  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

  early_stopping:
    enabled: true
    patience: 2
    min_delta: 0.001
    monitor: "eval_f1"

  checkpointing:
    save_steps: 500
    save_strategy: "epoch"
    save_total_limit: 3
    save_best_only: true
    metric_for_best_model: "eval_f1"
    greater_is_better: true

  evaluation:
    strategy: "epoch"
    steps: 500

  logging:
    steps: 100
    report_to: ["tensorboard"]
  seed: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - confusion_matrix
  average: "weighted"

visualization:
  dpi: 300
  figure_format: "png"
  style: "seaborn-v0_8-darkgrid"
  palette: "husl"
  plots:
    class_distribution: true
    text_length_distribution: true
    word_cloud: true
    label_correlation: true
    training_curves: true
    confusion_matrix: true
    roc_curve: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/training.log"
  console: true

hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true

experiment:
  name: "llm-misinformation-detection"
  description: "Fine-tuning FinBERT and RoBERTa for misinformation detection"
  tags: ["fake-news", "misinformation", "fine-tuning", "bert"]
  wandb:
    enabled: false
    project: "llm-fine-tuning"
    entity: null

reproducibility:
  deterministic: true
  benchmark: false

retriever:
  ollama_host: "http://localhost:11434"
  ollama_model: "mistral"
  max_keywords: 5
  max_wiki_results: 2
  max_ddg_results: 3
  timeout: 10

counter_narrative:
  ollama_host: "http://localhost:11434"
  model: "mistral"
  temperature: 0.1
  max_tokens: 1800
  timeout: 120
  max_retries: 2